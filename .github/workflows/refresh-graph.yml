name: Refresh graph bundle

# Rebuilds the embedded Session Graph page (internal/graph/ui/graph.html) from
# promptconduit/editor-extension main and opens a PR when it changed — so the
# page `promptconduit graph` serves doesn't drift from the extension repo's
# portable graph core without anyone running `make refresh-graph` by hand.
#
# Triggers:
#   - workflow_dispatch  : run it on demand from the Actions tab.
#   - schedule (weekly)  : safety net so drift is caught even if nobody dispatches.
#   - repository_dispatch: optional auto-trigger; have editor-extension POST a
#     `graph-updated` (or `extension-released`) dispatch on release.
#
# Unlike the .vsix refresh, esbuild output is DETERMINISTIC, so change detection
# is a plain byte diff of the rebuilt file — no version bookkeeping needed.
#
# Opening the PR uses the default GITHUB_TOKEN, which requires the repo setting
# "Allow GitHub Actions to create and approve pull requests" to be enabled.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  repository_dispatch:
    types: [graph-updated, extension-released]

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v7

      - name: Checkout editor-extension
        uses: actions/checkout@v7
        with:
          repository: promptconduit/editor-extension
          ref: main
          path: editor-extension

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.21"

      - name: Rebuild embedded graph page
        run: make refresh-graph EXTENSION_DIR=editor-extension

      - name: Detect change
        id: check
        run: |
          set -euo pipefail
          if git diff --quiet -- internal/graph/ui/graph.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Embedded graph page is already up to date — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify CLI still builds and tests pass
        if: steps.check.outputs.changed == 'true'
        run: |
          make build
          go test ./internal/graph/...

      - name: Open refresh PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          page="internal/graph/ui/graph.html"
          branch="chore/refresh-graph-bundle-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$page"
          git commit -m "chore(graph): refresh embedded session graph page"
          git push origin "$branch"
          if gh pr create --base main --head "$branch" \
              --title "chore(graph): refresh embedded session graph page" \
              --body "Automated refresh of the embedded Session Graph page (\`$page\`) from \`promptconduit/editor-extension\` main's portable graph core, opened by the **Refresh graph bundle** workflow. CLI build + graph tests passed on this artifact."; then
            echo "Opened refresh PR."
          else
            echo "::warning::Could not open the PR automatically (enable 'Allow GitHub Actions to create and approve pull requests', or open one from branch ${branch})."
          fi
